name: Keep backend awake

# Render's free plan sleeps after 15 min idle; a cold start makes the site's first load time out.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 -o /dev/null https://truecharts.onrender.com/ || true
